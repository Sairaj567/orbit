services:
  postgres:
    image: pgvector/pgvector:pg17
    ports:
      - '5432:5432'

  redis:
    ports:
      - '6379:6379'

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: orbit-pgadmin
    restart: unless-stopped
    ports:
      - '5050:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@orbit.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres
